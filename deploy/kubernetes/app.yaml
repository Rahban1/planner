apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: planner-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: planner
  template:
    metadata:
      labels:
        app: planner
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: planner-app
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: planner-config
          env:
            - name: RUNNER_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: planner-secrets
                  key: RUNNER_API_TOKEN
            - name: BITBUCKET_READ_TOKEN
              valueFrom:
                secretKeyRef:
                  name: planner-secrets
                  key: BITBUCKET_READ_TOKEN
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: '2', memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: planner-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: planner
spec:
  selector:
    app: planner
  ports:
    - name: http
      port: 3000
      targetPort: http
