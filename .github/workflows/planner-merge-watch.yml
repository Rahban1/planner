name: Planner pull-request check

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-pull-requests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: planner-runner
    env:
      PLANNER_BASE_URL: ${{ vars.PLANNER_BASE_URL }}
      RUNNER_API_TOKEN: ${{ secrets.RUNNER_API_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
      RUNNER_MERGE_CHECK_ONLY: '1'

    steps:
      - name: Check out Planner
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent-runner/package-lock.json

      - name: Check pull-request states once
        shell: bash
        run: |
          : "${PLANNER_BASE_URL:?Set the PLANNER_BASE_URL environment variable}"
          : "${RUNNER_API_TOKEN:?Set the RUNNER_API_TOKEN environment secret}"
          : "${GITHUB_TOKEN:?Set the AGENT_GITHUB_TOKEN environment secret}"
          npm ci --prefix agent-runner
          npm run build --prefix agent-runner
          node agent-runner/dist/index.js
